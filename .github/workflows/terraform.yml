name: Terraform

on:
  push:
    paths: ['infra/terraform/**', '.github/workflows/terraform.yml']
  pull_request:
    paths: ['infra/terraform/**', '.github/workflows/terraform.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        directory: [infra/terraform/bootstrap, infra/terraform/environments/dev, infra/terraform/github-identity, infra/terraform/modules/private-documents, infra/terraform/modules/campus-avd]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
      - name: Test configuration without Azure credentials
        run: terraform test
  state-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate zero-deploy Terraform state ownership
        run: python3 scripts/validate_tf_state_topology.py
