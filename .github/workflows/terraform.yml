name: Terraform

on:
  push:
    paths: ['infra/terraform/**', 'scripts/dev_foundation_check.sh', 'scripts/validate_tf_state_topology.py', 'Makefile', '**/*.tfstate', '**/*.tfstate.*', '**/*.tfplan', '.github/workflows/terraform.yml']
  pull_request:
    paths: ['infra/terraform/**', 'scripts/dev_foundation_check.sh', 'scripts/validate_tf_state_topology.py', 'Makefile', '**/*.tfstate', '**/*.tfstate.*', '**/*.tfplan', '.github/workflows/terraform.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        directory: [infra/terraform/bootstrap, infra/terraform/github-identity, infra/terraform/modules/private-documents, infra/terraform/modules/campus-avd]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
      - name: Test configuration without Azure credentials
        run: terraform test
  dev-scenario:
    name: DEV foundation scenario
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - run: make dev-scenario
