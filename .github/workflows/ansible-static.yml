name: Campus Ansible static validation

on:
  push:
    paths:
      - 'infra/ansible/**'
      - '.github/workflows/ansible-static.yml'
  pull_request:
    paths:
      - 'infra/ansible/**'
      - '.github/workflows/ansible-static.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'ansible-core>=2.17,<2.21'
      - name: Local-only syntax and policy
        working-directory: infra/ansible
        run: |
          ansible-playbook --syntax-check playbooks/validate-lab-host.yml
          ansible-playbook playbooks/validate-lab-host.yml
