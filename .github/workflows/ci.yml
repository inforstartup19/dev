name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check repository
        run: python3 scripts/check_repo.py
      - name: Set up Node for static Site tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test static Site navigation and login scenarios
        run: node --test sites/incforstartup/tests/*.test.cjs supabase/tests/campus-document-review.test.mjs
